<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Flavors Tea — Image Manager</title>
<style>
:root{--green:#14532d;--green2:#1f7a43;--bg:#f4f7f3;--card:#fff;--line:#dfe7e1;--text:#17211b;--muted:#66736a;--danger:#b42318}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 Arial,sans-serif}
header{background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}
.bar{max-width:1180px;margin:auto;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-size:19px;font-weight:800;color:var(--green)}.brand small{display:block;font-size:11px;font-weight:500;color:var(--muted);margin-top:2px}
.wrap{max-width:1180px;margin:auto;padding:24px 20px 60px}
.intro{background:linear-gradient(135deg,#eaf7ed,#fff);border:1px solid #d7eadb;border-radius:18px;padding:22px;margin-bottom:22px}
.intro h1{margin:0 0 7px;font-size:25px}.intro p{margin:0;color:var(--muted)}
.login{max-width:430px;margin:70px auto}.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:20px;box-shadow:0 6px 24px rgba(20,83,45,.06)}
label{display:block;font-weight:700;margin:0 0 7px}
input[type=password]{width:100%;padding:12px;border:1px solid #ccd7ce;border-radius:10px;font-size:15px}
.btn{border:0;border-radius:10px;padding:11px 15px;background:var(--green2);color:#fff;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.55;cursor:not-allowed}.btn.ghost{background:#fff;color:var(--green);border:1px solid #b9cbbd}
.msg{margin-top:12px;padding:10px;border-radius:9px;display:none}.msg.ok{display:block;background:#eaf7ed;color:#166534}.msg.err{display:block;background:#fff1f0;color:var(--danger)}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}.toolbar h2{margin:0;font-size:18px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.slot{background:#fff;border:1px solid var(--line);border-radius:15px;overflow:hidden}
.preview{background:#edf2ed;aspect-ratio:16/9;display:flex;align-items:center;justify-content:center;overflow:hidden}
.preview img{width:100%;height:100%;object-fit:cover;display:block}.preview.missing{color:#77857b;font-size:12px}
.body{padding:14px}.name{font-weight:800;margin-bottom:3px}.file{font-size:11px;color:var(--muted);word-break:break-all;margin-bottom:12px}
.upload{width:100%;padding:9px;border:1px dashed #aebeb1;border-radius:9px;background:#fafcf9}
.status{font-size:12px;color:var(--muted);margin-top:8px;min-height:17px}.section{margin:28px 0 10px;font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--green2);font-weight:800}
.note{font-size:12px;color:var(--muted);margin-top:16px}.hidden{display:none!important}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:520px){.grid{grid-template-columns:1fr}.wrap{padding:16px 12px 45px}.bar{padding:13px 12px}.intro h1{font-size:21px}}
</style>
</head>
<body>
<header><div class="bar"><div class="brand">Flavors Tea <small>Admin · Image Manager</small></div><button id="logout" class="btn ghost hidden" onclick="logout()">Log out</button></div></header>

<main class="wrap">
<div id="login" class="login">
  <div class="panel">
    <h2 style="margin-top:0">Admin login</h2>
    <p style="color:var(--muted)">Sign in to manage the storefront images.</p>
    <form onsubmit="login(event)">
      <label>Admin password</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="btn" style="margin-top:14px;width:100%">Sign in</button>
    </form>
    <div id="loginMsg" class="msg"></div>
  </div>
</div>

<div id="manager" class="hidden">
  <div class="intro">
    <h1>Storefront Image Manager</h1>
    <p>Each card is a fixed image slot. Uploading a new image replaces only that image.</p>
  </div>
  <div class="toolbar"><h2>Images</h2><button class="btn ghost" onclick="loadSlots()">Refresh</button></div>
  <div id="slots"></div>
  <p class="note">JPG, PNG and WebP supported. Maximum 8 MB per image.</p>
</div>
</main>

<script>
const $=s=>document.querySelector(s);
let slots=[];

function msg(el,text,ok=false){
  el.textContent=text;
  el.className='msg '+(ok?'ok':'err');
}

async function req(url,opts={}){
  const r=await fetch(url,{credentials:'same-origin',...opts});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw Error(d.error||'Request failed');
  return d;
}

/* FIXED: server expects JSON, not FormData */
async function login(e){
  e.preventDefault();
  const password=$('#password').value;

  try{
    await req('/api/admin/image-login',{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({password:password})
    });

    msg($('#loginMsg'),'Login successful.',true);
    showManager();
  }catch(x){
    msg($('#loginMsg'),x.message||'Incorrect admin password.');
  }
}

function showManager(){
  $('#login').classList.add('hidden');
  $('#manager').classList.remove('hidden');
  $('#logout').classList.remove('hidden');
  loadSlots();
}

async function logout(){
  await req('/api/admin/image-logout',{method:'POST'}).catch(()=>{});
  location.reload();
}

async function loadSlots(){
  try{
    const d=await req('/api/admin/image-slots');
    slots=d.slots;
    render();
  }catch(x){
    if((x.message||'').toLowerCase().includes('login')) location.reload();
    else alert(x.message);
  }
}

function group(title,list){
  return '<div class="section">'+esc(title)+'</div><div class="grid">'+list.map(slotCard).join('')+'</div>';
}

function slotCard(s){
  const src=s.url+(s.exists?'?v='+encodeURIComponent(s.version):'');
  return '<article class="slot">'+
    '<div class="preview '+(s.exists?'':'missing')+'">'+
      (s.exists?'<img src="'+src+'" alt="'+esc(s.label)+'">':'No image uploaded')+
    '</div>'+
    '<div class="body">'+
      '<div class="name">'+esc(s.label)+'</div>'+
      '<div class="file">'+esc(s.filename)+'</div>'+
      '<input class="upload" type="file" accept="image/jpeg,image/png,image/webp" onchange="uploadSlot(\''+escAttr(s.id)+'\',this)">'+
      '<div class="status" id="st-'+escAttr(s.id)+'">'+(s.exists?'Current image':'Waiting for upload')+'</div>'+
    '</div></article>';
}

function render(){
  const by={};
  for(const s of slots)(by[s.group]??=[]).push(s);
  $('#slots').innerHTML=Object.entries(by).map(([g,a])=>group(g,a)).join('');
}

async function uploadSlot(id,input){
  const st=$('#st-'+id);
  const f=input.files[0];
  if(!f)return;

  if(f.size>8*1024*1024){
    st.textContent='Image must be 8 MB or smaller.';
    return;
  }

  st.textContent='Uploading…';
  input.disabled=true;

  try{
    const dataUrl=await fileDataUrl(f);
    await req('/api/admin/image-slots/'+encodeURIComponent(id),{
      method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({data:dataUrl})
    });
    st.textContent='Uploaded successfully';
    st.style.color='var(--green2)';
    await loadSlots();
  }catch(x){
    st.textContent=x.message;
    st.style.color='var(--danger)';
  }finally{
    input.disabled=false;
    input.value='';
  }
}

function fileDataUrl(file){
  return new Promise((resolve,reject)=>{
    const r=new FileReader();
    r.onload=()=>resolve(r.result);
    r.onerror=()=>reject(new Error('Could not read the selected image.'));
    r.readAsDataURL(file);
  });
}

function esc(s){
  return String(s??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
  }[c]));
}

function escAttr(s){
  return esc(s).replace(/\\/g,'\\\\');
}

/* Check existing session */
(async()=>{
  try{
    await req('/api/admin/image-me');
    showManager();
  }catch{}
})();
</script>
</body>
</html>
